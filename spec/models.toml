# Shared with the Android build. Every model Kin loads is listed here with a
# pinned sha256; `kin fetch-models` downloads and verifies, the running app
# never downloads anything.

[vad]
engine = "onnxruntime"
name = "Silero VAD v5"
url = "https://github.com/snakers4/silero-vad/raw/v5.1.2/src/silero_vad/data/silero_vad.onnx"
