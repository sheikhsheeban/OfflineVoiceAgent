files = { "silero_vad.onnx" = "2623a2953f6ff3d2c1e61740c6cdb7168133479b267dfef114a4a3cc5bdd788f" }

[wake_word]
engine = "openwakeword"
# Stand-in until the custom "Hey Kin" model is trained; swap `keyword` and the
# file below when it exists.
