[asr]
# Which speech-to-text model each profile uses. Override with `--asr NAME` or KIN_ASR.
# Measured on this laptop (tests/data/asr_eval, 12 sentences with Indian names, clean + noisy):
#   moonshine-tiny  WER 21.5% / 25.9%, names 22/68, RTF 0.033, ~180 MB
#   moonshine-base  WER 14.1% / 15.5%, names 35/68, RTF 0.045, ~250 MB   <- phone default
#   parakeet-0.6b   WER 11.1% / 12.2%, names 41/68, RTF 0.116, ~800 MB   <- laptop default
#   whisper-small   WER 11.1% / 11.2%, names 43/68, RTF 0.55,  ~800 MB   (slow; strong on accents)
phone = "moonshine-base"
laptop = "parakeet-0.6b"

