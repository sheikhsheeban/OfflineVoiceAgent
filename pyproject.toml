[project]
name = "kin"
version = "0.1.0"
description = "Kin offline voice companion - laptop demo build"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26,<3",
    "sounddevice>=0.4.6",
    "onnxruntime>=1.17",
    "sherpa-onnx>=1.10",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12",
    "psutil>=5.9",
    "sqlcipher3-wheels>=0.5.7",
    "sqlite-vec>=0.1.9",
    "keyring>=25.7.0",
    "tokenizers>=0.23.2",
    "llama-cpp-python==0.3.19",
    "dateparser>=1.4.3",
    "icalendar>=7.3.0",
]

[project.scripts]
kin = "kin.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "openwakeword>=0.6.0"]  # openwakeword: reference for the parity test only

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "models: needs downloaded models (run `uv run kin fetch-models`)",
    "mic: needs a real microphone",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["kin.config.AudioSettings", "kin.perception.segmenter.EpisodePolicy"]

# llama-cpp-python only ships source on PyPI; this index has prebuilt CPU wheels
# (the design's "prebuilt wheels for each laptop" risk), so no C++ compiler is needed.
[[tool.uv.index]]
name = "llama-cpp-cpu"
url = "https://abetlen.github.io/llama-cpp-python/whl/cpu"
explicit = true

[tool.uv.sources]
llama-cpp-python = { index = "llama-cpp-cpu" }
